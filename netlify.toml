[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"

# Environment variables should be set in Netlify Dashboard:
# Site settings → Environment variables
# Add:
# - REACT_APP_SUPABASE_URL
# - REACT_APP_SUPABASE_ANON_KEY

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

